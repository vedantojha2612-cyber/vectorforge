[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorforge"
version = "0.1.0"
description = "Real-Time 3D HNSW High-Dimensional Vector Search Engine & Hologram"
authors = [
    { name = "Saarthak Ojha", email = "vedantojha2612@gmail.com" },
    { name = "TEAM GODS" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["hnsw", "vector-search", "approximate-nearest-neighbors", "webgl", "tui", "threejs", "radar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines",
]

dependencies = []

[project.scripts]
vectorforge = "cli:main"
