name: VectorForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: HNSW Algorithm & Visual Surface Invariant Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify zero external dependencies
      run: |
        python -c "import math, random, heapq, threading, socket, http.server, json; print('100% Python standard library verified (0 pip dependencies)')"

    - name: Run complete test suite (HNSW, Distance Math, TUI Radar, WebGL Server, Security)
      run: |
        PYTHONPATH=. python -m unittest discover -s tests -v

    - name: Run HNSW recall benchmark harness
      run: |
        PYTHONPATH=. python cli.py benchmark
